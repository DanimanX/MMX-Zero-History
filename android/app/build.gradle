plugins {
    id 'com.android.application'
}

// Firma: el keystore nunca se versiona. Se pasa por entorno (CI) o por
// -PmmxKeystore=... en la línea de comandos. Sin esas variables el APK de
// release queda sin firmar y no se puede instalar; tools/build_android.sh
// genera uno efímero cuando no encuentra ninguno.
def mmxKeystore = System.getenv('MMX_KEYSTORE') ?: project.findProperty('mmxKeystore')
def mmxKeyAlias = System.getenv('MMX_KEY_ALIAS') ?: project.findProperty('mmxKeyAlias') ?: 'mmx'
def mmxStorePass = System.getenv('MMX_KEYSTORE_PASSWORD') ?: project.findProperty('mmxKeystorePassword')
def mmxKeyPass = System.getenv('MMX_KEY_PASSWORD') ?: project.findProperty('mmxKeyPassword')
def hasSigning = mmxKeystore && mmxStorePass && mmxKeyPass
def mmxAbi = project.findProperty('mmxAbi') ?: 'arm64-v8a'

android {
    namespace 'cl.zerohistory.mmx'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'cl.zerohistory.mmx'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.0.6'
        ndk {
            // El host compilado por CMake se empaqueta por ABI.
            abiFilters mmxAbi
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Solo la capa táctil. El binario del juego viene de jniLibs/.
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // libMegaManX3SNESRecomp.so lo deja acá el build de CMake del motor.
            jniLibs.srcDirs = ['src/main/jniLibs']
            // assets/ es donde el usuario pone su propio mmx3.sfc. No se commitea.
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(mmxKeystore)
                storePassword mmxStorePass
                keyAlias mmxKeyAlias
                keyPassword mmxKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            // El APK es un host LLE sin código derivado del ROM. No se ofusca
            // ni se recorta: el binario nativo ya viene compilado.
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // SDL3 para Android se vendoriza como librería nativa + clases Java;
    // ver tools/build_android.sh y docs/ANDROID.md.
}
