name: Android

# Construye el APK de Android a mano. El artefacto es un host LLE sin código
# derivado del ROM: el jugador pone su propio mmx3.sfc en el almacenamiento de
# la app. No necesita el secreto MMX3_ROM_BASE64.
#
# Desde v0.0.2 el mismo paso corre dentro de Release, así que este workflow es
# el banco de pruebas de un ABI concreto (arm64-v8a, armeabi-v7a, x86_64) sin
# publicar nada.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI a compilar'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: ['arm64-v8a', 'armeabi-v7a', 'x86_64']

permissions:
  contents: read

jobs:
  apk:
    name: APK ${{ github.event.inputs.abi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # El runner ubuntu-latest ya trae Android SDK y sdkmanager. No usamos
      # android-actions/setup-android: su instalación por defecto pide el
      # paquete "tools", que el repositorio de Google ya no publica.
      - name: Instalar NDK r27 y CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          mkdir -p "$RUNNER_TEMP/toolchains"
          MMX_TOOLCHAIN_DIR="$RUNNER_TEMP/toolchains" \
            bash tools/build_android.sh "${{ github.event.inputs.abi }}"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mmx-zero-history-android-${{ github.event.inputs.abi }}
          path: dist/*.apk
          if-no-files-found: error
