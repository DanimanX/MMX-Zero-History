name: Android

# Construye el APK de Android a mano. El artefacto es un host LLE sin código
# derivado del ROM: el jugador pone su propio mmx3.sfc en el almacenamiento de
# la app. No necesita el secreto MMX3_ROM_BASE64.
#
# Desde v0.0.2 el mismo paso corre dentro de Release, así que este workflow es
# el banco de pruebas de un ABI concreto (arm64-v8a, armeabi-v7a, x86_64) sin
# publicar nada.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI a compilar'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: ['arm64-v8a', 'armeabi-v7a', 'x86_64']

permissions:
  contents: read

jobs:
  apk:
    name: APK ${{ github.event.inputs.abi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK r27 y CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          mkdir -p "$RUNNER_TEMP/toolchains"
          MMX_TOOLCHAIN_DIR="$RUNNER_TEMP/toolchains" \
            bash tools/build_android.sh "${{ github.event.inputs.abi }}"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mmx-zero-history-android-${{ github.event.inputs.abi }}
          path: dist/*.apk
          if-no-files-found: error
