name: Release

# Publica el artefacto de una etiqueta v*: host de escritorio para Linux,
# Windows y macOS, el APK de Android, más el arte y la banda sonora.
#
# ADVERTENCIA LEGAL: este repositorio no contiene ni distribuye el ROM. Los
# binarios de escritorio son el *setup host* (sin código de invitado); cada
# jugador compila su propia versión jugable con su propio dump. El APK es un
# host LLE sin código derivado del ROM: el jugador pone su mmx3.sfc en el
# almacenamiento de la app. Ver docs/ESTADO.md y docs/ANDROID.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (ej. v0.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: MMXZeroHistory-linux-x86_64
          - name: Windows
            os: windows-latest
            artifact: MMXZeroHistory-windows-x86_64
          - name: macOS
            os: macos-latest
            artifact: MMXZeroHistory-macos-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev libgl1-mesa-dev

      - name: Instalar dependencias (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2

      - name: Instalar dependencias (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja --yes --no-progress
          vcpkg install sdl2:x64-windows

      - name: Configurar
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSNESRECOMP_SDL_BACKEND=SDL2 \
              -DSNESRECOMP_SETUP_HOST=ON \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSNESRECOMP_SDL_BACKEND=SDL2 \
              -DSNESRECOMP_SETUP_HOST=ON
          fi

      - name: Compilar
        shell: bash
        run: cmake --build build --target MegaManX3SNESRecomp --parallel 4

      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist
          exe="build/MegaManX3SNESRecomp"
          if [ -f "${exe}.exe" ]; then exe="${exe}.exe"; fi
          cp "$exe" "dist/$(basename "$exe")"
          cp README.md LICENSE VERSION dist/
          cp docs/ROM_README.txt dist/ROM_README.txt
          mkdir -p dist/audio dist/img
          cp assets/audio/*.ogg dist/audio/ 2>/dev/null || true
          cp docs/img/*.png dist/img/ 2>/dev/null || true
          # El catálogo de mods viaja con el ejecutable: el runtime lo lee de
          # mods/preloaded/packages, y sin él el 16:9 queda deshabilitado.
          cp -r build/mods dist/mods 2>/dev/null || true
          # zip existe en Linux y macOS; Git Bash en Windows no lo trae, pero
          # sí bsdtar, que con -a arma un .zip a partir de la extension.
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -r "../${{ matrix.artifact }}.zip" . >/dev/null
          else
            tar -a -c -f "../${{ matrix.artifact }}.zip" .
          fi

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK r27 y CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Instalar ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore de firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.MMX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MMX_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MMX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mmx-release.jks"
            {
              echo "MMX_KEYSTORE=$RUNNER_TEMP/mmx-release.jks"
              echo "MMX_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "MMX_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::MMX_KEYSTORE_BASE64 no configurado: se firma con una clave efímera."
          fi

      - name: Compilar APK (host LLE sin ROM)
        run: |
          mkdir -p "$RUNNER_TEMP/toolchains"
          MMX_TOOLCHAIN_DIR="$RUNNER_TEMP/toolchains" \
            bash tools/build_android.sh arm64-v8a

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MMXZeroHistory-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MMX Zero History ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES_v0.0.2.md
          files: |
            artifacts/*.zip
            artifacts/*.apk
          draft: false
          prerelease: false
